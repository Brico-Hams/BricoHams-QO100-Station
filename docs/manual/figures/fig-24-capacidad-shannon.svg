<title id="t">Capacidad de canal AWGN en bit/s/Hz entre 0 y 30 dB de SNR</title>
<desc id="d">La capacidad por hercio vale 1 bit/s/Hz a 0 dB, 3,46 a 10 dB y 6,66 a 20 dB. A SNR alta crece unos 3,3 bit/s/Hz por cada 10 dB, casi una recta.</desc>
