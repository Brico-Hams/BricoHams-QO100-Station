<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t d">
<title id="t">Rango dinámico teórico del ADC según los bits</title>
<desc id="d">Barras con el rango dinámico teórico 6,02·N+1,76 dB: 8 bits 49,9 dB, 12 bits 74,0 dB, 14 bits 86,0 dB y 16 bits 98,1 dB. Ejemplos de SDR: RTL-SDR 8 bits, Airspy y ADALM-Pluto 12 bits, SDRplay 14 bits.</desc>
<style>text{font:14px system-ui,'Segoe UI',Arial,sans-serif;fill:#12263f}.s{font-size:12px;fill:#5b6b7b}.b{font-weight:700}.h{font-size:16px;font-weight:700}</style>
<rect width="800" height="360" fill="#f7f8fa"/>
<text x="20" y="28" class="h">SNR ideal ≈ 6,02·N + 1,76 dB (señal senoidal a plena escala)</text>
<rect x="160" y="60" width="299" height="44" fill="#12263f"/>
<rect x="160" y="120" width="444" height="44" fill="#5b6b7b"/>
<rect x="160" y="180" width="516" height="44" fill="#12263f"/>
<rect x="160" y="240" width="589" height="44" fill="#e8871e"/>
<g class="b" text-anchor="end"><text x="150" y="88">8 bits</text><text x="150" y="148">12 bits</text><text x="150" y="208">14 bits</text><text x="150" y="268">16 bits</text></g>
<g class="b"><text x="170" y="88" style="fill:#fff">49,9 dB</text><text x="170" y="148" style="fill:#fff">74,0 dB</text><text x="170" y="208" style="fill:#fff">86,0 dB</text><text x="170" y="268">98,1 dB</text></g>
<text x="160" y="316" class="s">RTL-SDR 8 b · Airspy y Pluto 12 b · SDRplay 14 b. En la práctica se pierden 1–2 bits (ENOB).</text>
<text x="790" y="352" text-anchor="end" class="s">BricoHams · bricohams.org</text>
</svg>
