<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
<title id="t">Rejilla de tonos y tiempo de FT8</title>
<desc id="d">FT8 usa 8 tonos separados 6,25 Hz y 79 símbolos de 0,16 s. Tres bloques de sincronismo Costas de 7 símbolos ocupan los símbolos 0 a 6, 36 a 42 y 72 a 78; entre ellos van 29 símbolos de datos cada bloque.</desc>
<style>text{font:14px system-ui,'Segoe UI',Arial,sans-serif;fill:#12263f}.s{font-size:12px;fill:#5b6b7b}.b{font-weight:700}.h{font-size:16px;font-weight:700}.l{stroke:#12263f;stroke-width:1.5;fill:none}</style>
<rect width="800" height="380" fill="#f7f8fa"/>
<text x="20" y="28" class="h">79 símbolos × 0,16 s = 12,64 s; 8 tonos × 6,25 Hz = 50 Hz</text>
<rect x="80" y="60" width="680" height="240" fill="#fff" stroke="#12263f" stroke-width="2"/>
