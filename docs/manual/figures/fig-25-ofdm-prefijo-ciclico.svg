<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d">
<title id="t">Sobrecarga del prefijo cíclico en OFDM con N = 64</title>
<desc id="d">Barras para prefijos de 4, 8, 16 y 32 muestras sobre 64: 5,9 %, 11,1 %, 20 % y 33,3 % del tiempo de símbolo. El prefijo de 16 muestras, en naranja, cuesta el 20 %.</desc>
<style>text{font:14px system-ui,'Segoe UI',Arial,sans-serif;fill:#12263f}.s{font-size:12px;fill:#5b6b7b}.b{font-weight:700}.h{font-size:16px;font-weight:700}.grid{stroke:#d5dbe2;stroke-width:1}.axis{stroke:#12263f;stroke-width:1.5}</style>
<rect width="800" height="500" fill="#f7f8fa"/>
<line class="grid" x1="80" y1="420" x2="760" y2="420"/><text x="72" y="424" text-anchor="end" class="s">0 %</text><line class="grid" x1="80" y1="330" x2="760" y2="330"/><text x="72" y="334" text-anchor="end" class="s">10 %</text><line class="grid" x1="80" y1="240" x2="760" y2="240"/><text x="72" y="244" text-anchor="end" class="s">20 %</text><line class="grid" x1="80" y1="150" x2="760" y2="150"/><text x="72" y="154" text-anchor="end" class="s">30 %</text><line class="grid" x1="80" y1="60" x2="760" y2="60"/><text x="72" y="64" text-anchor="end" class="s">40 %</text><rect x="80" y="60" width="680" height="360" fill="none" class="axis"/><text x="420" y="462" text-anchor="middle">Longitud del prefijo cíclico (muestras), N = 64</text><text transform="translate(24 240) rotate(-90)" text-anchor="middle">Tiempo útil perdido (%)</text><text x="80" y="36" class="h">Coste del prefijo cíclico: Ncp / (N + Ncp)</text><rect x="114" y="367.06" width="102" height="52.94" fill="#12263f"/><text x="165" y="359.06" text-anchor="middle" class="b">5,9 %</text><text x="165" y="438" text-anchor="middle" class="s">CP = 4</text><rect x="284" y="320" width="102" height="100" fill="#12263f"/><text x="335" y="312" text-anchor="middle" class="b">11,1 %</text><text x="335" y="438" text-anchor="middle" class="s">CP = 8</text><rect x="454" y="240" width="102" height="180" fill="#e8871e"/><text x="505" y="232" text-anchor="middle" class="b">20,0 %</text><text x="505" y="438" text-anchor="middle" class="s">CP = 16</text><rect x="624" y="120" width="102" height="300" fill="#12263f"/><text x="675" y="112" text-anchor="middle" class="b">33,3 %</text><text x="675" y="438" text-anchor="middle" class="s">CP = 32</text>
<text x="790" y="490" text-anchor="end" class="s">BricoHams · bricohams.org</text>
</svg>
