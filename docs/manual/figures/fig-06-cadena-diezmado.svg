<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d">
<title id="t">Cadena de diezmado de 2,4 MS/s a 12 kS/s</title>
<desc id="d">El SDR entrega 2,4 millones de muestras por segundo. Tres etapas de filtro paso bajo y diezmado, entre 10, entre 5 y entre 4, reducen la tasa a 240 kS/s, 48 kS/s y 12 kS/s, que es la tasa que usan los decodificadores FT8 y FT4 de BricoHams.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#12263f"/></marker></defs>
<style>text{font:14px system-ui,'Segoe UI',Arial,sans-serif;fill:#12263f}.s{font-size:12px;fill:#5b6b7b}.b{font-weight:700}.h{font-size:16px;font-weight:700}.bx{fill:#fff;stroke:#12263f;stroke-width:2}.bo{fill:#fdeccf;stroke:#e8871e;stroke-width:2.5}.l{stroke:#12263f;stroke-width:2;fill:none}</style>
<rect width="800" height="300" fill="#f7f8fa"/>
<text x="20" y="28" class="h">Filtrar primero, tirar muestras después: 10 × 5 × 4 = 200</text>
<rect x="20" y="90" width="110" height="60" class="bx"/><text x="75" y="115" text-anchor="middle" class="b">SDR</text><text x="75" y="134" text-anchor="middle" class="s">2,4 MS/s</text>
<rect x="190" y="90" width="120" height="60" class="bo"/><text x="250" y="114" text-anchor="middle" class="b">FIR + ↓10</text><text x="250" y="134" text-anchor="middle" class="s">corte ≈ 100 kHz</text>
<rect x="370" y="90" width="120" height="60" class="bo"/><text x="430" y="114" text-anchor="middle" class="b">FIR + ↓5</text><text x="430" y="134" text-anchor="middle" class="s">corte ≈ 20 kHz</text>
<rect x="550" y="90" width="120" height="60" class="bo"/><text x="610" y="114" text-anchor="middle" class="b">FIR + ↓4</text><text x="610" y="134" text-anchor="middle" class="s">corte ≈ 5 kHz</text>
<rect x="715" y="90" width="70" height="60" class="bx"/><text x="750" y="115" text-anchor="middle" class="b">Audio</text><text x="750" y="134" text-anchor="middle" class="s">12 kS/s</text>
<path d="M130 120 L190 120 M310 120 L370 120 M490 120 L550 120 M670 120 L715 120" class="l" marker-end="url(#a)"/>
<g class="s" text-anchor="middle"><text x="160" y="108">2,4 MS/s</text><text x="340" y="108">240 kS/s</text><text x="520" y="108">48 kS/s</text><text x="692" y="108">12 kS/s</text></g>
<text x="20" y="200" class="s">Cada etapa elimina lo que quedaría plegado (alias) al descartar muestras. Se diezma por fases porque</text>
<text x="20" y="220" class="s">un único filtro estrecho a 2,4 MS/s necesitaría miles de coeficientes; en cascada basta una fracción.</text>
<text x="790" y="292" text-anchor="end" class="s">BricoHams · bricohams.org</text>
</svg>
