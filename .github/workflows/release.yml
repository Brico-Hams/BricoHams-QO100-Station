name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --x64 --publish never
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.sha256

  linux-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --linux AppImage --x64 --arm64 --publish never
      - name: Checksums
        run: cd dist && for f in *.AppImage; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: |
            dist/*.AppImage
            dist/*.sha256

  deb:
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test
      - run: bash packaging/linux/build-deb.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.sha256

  calculators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip WordPress plugin
        run: |
          mkdir -p dist
          cd services
          zip -r ../dist/bricohams-qo100-calculators.zip qo100-calculators
      - uses: actions/upload-artifact@v4
        with:
          name: calculators
          path: dist/bricohams-qo100-calculators.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux-desktop, deb, calculators]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
