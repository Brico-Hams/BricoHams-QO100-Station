# BricoHams QO-100 Station: keep the kernel DVB-T driver away from RTL-SDR dongles so that SDRangel (librtlsdr) can open them.
# Installed to /etc/modprobe.d/blacklist-bricohams-rtl.conf. Remove it (or purge the package) if you need the dongle as a TV tuner.
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2830
